<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="100%" stop-color="#0F111A" />
    </linearGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="textAce" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="emblemFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Background Card -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="url(#emblemFill)" stroke="url(#neonCyanPurple)" stroke-width="1.8" />
  
  <!-- Emblem: Stylized E & Play Icon -->
  <g transform="translate(14, 14) scale(1.08)" filter="url(#glow)">
    <!-- E shape -->
    <path d="M7 6 H20 C22.2 6 24 7.8 24 10 V11 C24 12.1 23.1 13 22 13 H13 V19 H21 C22.1 19 23 19.9 23 21 V23 C23 24.1 22.1 25 21 25 H13 V31 H22 C23.1 31 24 31.9 24 33 V34 C24 36.2 22.2 38 20 38 H7 C5.9 38 5 37.1 5 36 V8 C5 6.9 5.9 6 7 6 Z" 
          fill="#131622" stroke="url(#neonCyanPurple)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Play Triangle -->
    <path d="M25 13.5 L39 22 L25 30.5 Z" 
          fill="#131622" stroke="url(#neonCyanPurple)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Inner cyan accent glow -->
    <polygon points="27,17 35,22 27,27" fill="#00F0FF" fill-opacity="0.4" />
  </g>

  <!-- Wordmark: EXPLAINER -->
  <text x="88" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5">EXPLAINER<tspan fill="url(#textAce)">ACE</tspan></text>

  <!-- Subtitle: SOFTWARE & SAAS VIDEOS -->
  <text x="89" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.5" letter-spacing="3.2">SOFTWARE &amp; SAAS VIDEOS</text>
</svg>
